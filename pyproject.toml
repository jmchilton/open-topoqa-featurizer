[project]
name = "open-topoqa-featurizer"
version = "0.0.1"
description = "Open clean-room reimplementation of the TopoQA element-specific persistent-homology interface featurizer (GUDHI)."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "gudhi",
    # biopython + DSSP (mkdssp) are needed only by the graph/conventional-feature layer
    # (interface extraction, SASA, phi/psi); the topological core depends on gudhi + numpy only.
    "biopython",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_topoqa_featurizer"]

[dependency-groups]
dev = ["pytest"]
